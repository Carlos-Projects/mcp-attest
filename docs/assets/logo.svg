<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="white" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Shield -->
  <g transform="translate(140, 120)">
    <path d="M0 60 C0 180 80 240 160 280 C240 240 320 180 320 60 L160 0 Z"
          fill="url(#shield)" opacity="0.9"/>
    <path d="M0 60 C0 180 80 240 160 280 C240 240 320 180 320 60 L160 0 Z"
          fill="none" stroke="url(#check)" stroke-width="4"/>
    <!-- Checkmark -->
    <path d="M100 150 L140 190 L230 100"
          fill="none" stroke="url(#check)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gear icon inside shield -->
    <circle cx="160" cy="140" r="15" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="160" y1="118" x2="160" y2="124" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="160" y1="156" x2="160" y2="162" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="138" y1="140" x2="144" y2="140" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="176" y1="140" x2="182" y2="140" stroke="#e2e8f0" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="440" y="195" font-family="system-ui, -apple-system, sans-serif"
        font-size="64" font-weight="800" fill="#e2e8f0">MCP Attest</text>

  <!-- Subtitle -->
  <text x="440" y="250" font-family="system-ui, -apple-system, sans-serif"
        font-size="28" fill="#94a3b8">Attested Tool-Server Admission for MCP</text>

  <!-- Tagline -->
  <text x="440" y="310" font-family="system-ui, -apple-system, sans-serif"
        font-size="22" fill="#64748b">Verify · Trust · Connect</text>

  <!-- Feature pills -->
  <g transform="translate(440, 360)">
    <rect x="0" y="0" rx="20" ry="20" width="160" height="40" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">🔐 Identity</text>

    <rect x="180" y="0" rx="20" ry="20" width="180" height="40" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="200" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">📋 Integrity</text>

    <rect x="380" y="0" rx="20" ry="20" width="180" height="40" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="400" y="26" font-family="system-ui, sans-serif" font-size="16" fill="#38bdf8">⚡ Trust Score</text>
  </g>

  <!-- Bottom text -->
  <text x="640" y="580" font-family="system-ui, -apple-system, sans-serif"
        font-size="16" fill="#475569" text-anchor="middle">MIT License · v0.1.0 · MCP Security Ecosystem</text>
</svg>
