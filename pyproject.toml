[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-attest"
version = "0.1.0"
description = "Attested Tool-Server Admission: Security extension for the Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Carlos-Projects", email = "Carlos@AIAgentObservatory.org" },
]
keywords = ["mcp", "security", "attestation", "ai", "llm", "tool-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "mcp-taxonomy>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Carlos-Projects/mcp-attest"
Repository = "https://github.com/Carlos-Projects/mcp-attest"
Documentation = "https://github.com/Carlos-Projects/mcp-attest#readme"
Changelog = "https://github.com/Carlos-Projects/mcp-attest/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Carlos-Projects/mcp-attest/issues"

[project.scripts]
mcp-attest = "mcp_attest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_attest"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage*",
    "/.ruff_cache",
    "/.pytest_cache",
    "/__pycache__",
    "*.pyc",
    ".coverage",
    ".coverage.*",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_attest", "mcp_taxonomy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/mcp_attest --cov-report=term-missing --cov-report=xml"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.coverage.run]
source = ["src/mcp_attest"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 80
